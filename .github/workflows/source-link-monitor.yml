name: Source Link Monitor

on:
  schedule:
    # Every Sunday at 03:00 UTC (Note: GitHub Actions cron is best-effort and may experience queuing delays)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of unique URLs to check (1 to 250, default 50)'
        required: false
        default: '50'
        type: string
      max_runtime:
        description: 'Maximum runtime in seconds (10 to 1800, default 600)'
        required: false
        default: '600'
        type: string
      offline:
        description: 'Run in offline mode (extract and update state without live network requests)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Preview next batch without executing HTTP probes or updating state'
        required: false
        default: false
        type: boolean
      reset_state:
        description: 'Reset rotation to cycle 1'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: source-link-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Source-Link Rotation Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read # Read-only isolation for external URL probes and report generation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed to resolve monitoring-state branch

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Retrieve persistent state from monitoring-state branch
        env:
          INPUT_RESET_STATE: ${{ inputs.reset_state || false }}
        run: |
          mkdir -p .monitoring_state monitoring_output
          # Retrieve and validate state from dedicated branch in read-only mode without modifying worktree
          python3 scripts/monitor_source_links.py \
            --sync-branch-pull \
            --state-branch monitoring-state \
            --state-file .monitoring_state/state.json

      - name: Execute source-link monitoring rotation
        env:
          INPUT_BATCH_SIZE: ${{ inputs.batch_size || '50' }}
          INPUT_MAX_RUNTIME: ${{ inputs.max_runtime || '600' }}
          INPUT_OFFLINE: ${{ inputs.offline || false }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || false }}
          INPUT_RESET_STATE: ${{ inputs.reset_state || false }}
        run: |
          # Safe execution passing parameters via validated environment variables
          python3 scripts/monitor_source_links.py \
            --data-dir data/datasets \
            --state-file .monitoring_state/state.json \
            --output-dir monitoring_output \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload monitoring reports and state artifact
        if: always() && hashFiles('monitoring_output/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: source-link-monitoring-${{ github.run_id }}
          path: |
            monitoring_output/
            .monitoring_state/state.json
          retention-days: 90

  persist-state:
    name: Persist Monitoring State
    needs: monitor
    if: success() && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Scoped strictly and exclusively to publishing state commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history to verify monitoring-state commits

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download state artifact from monitor job
        uses: actions/download-artifact@v4
        with:
          name: source-link-monitoring-${{ github.run_id }}
          path: artifact_download/

      - name: Configure Git identity for state persistence
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Persist updated state to monitoring-state branch
        run: |
          mkdir -p .monitoring_state
          cp artifact_download/.monitoring_state/state.json .monitoring_state/state.json
          # Push state.json with 3-way conflict reconciliation; fails explicitly on push failure
          python3 scripts/monitor_source_links.py \
            --sync-branch-push \
            --state-branch monitoring-state \
            --state-file .monitoring_state/state.json
