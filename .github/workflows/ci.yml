name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    name: Python Metadata Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Run dataset metadata validation
        run: python3 scripts/validate_datasets.py

      - name: Run pytest
        run: pytest

      - name: Verify deterministic catalog generation
        run: |
          python3 scripts/generate_catalog.py --output /tmp/catalog.1.json --quiet
          python3 scripts/generate_catalog.py --output /tmp/catalog.2.json --quiet
          diff -u /tmp/catalog.1.json /tmp/catalog.2.json

  frontend-quality:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.11 for catalog prebuild
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

      - name: Verify catalog presence in production bundle
        run: |
          test -f frontend/dist/data/catalog.json
          test -s frontend/dist/data/catalog.json
