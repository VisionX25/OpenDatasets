name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    name: Python Metadata Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run dataset metadata validation
        run: python3 scripts/validate_datasets.py

      - name: Run pytest
        run: pytest

      - name: Verify catalog consistency
        run: |
          python3 scripts/generate_catalog.py --output /tmp/catalog.generated.json
          if ! diff -u frontend/public/data/catalog.json /tmp/catalog.generated.json; then
            echo "::error::frontend/public/data/catalog.json is out of date! Run 'python3 scripts/generate_catalog.py' and commit the updated catalog."
            exit 1
          fi

  frontend-quality:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.11 for catalog prebuild
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build
